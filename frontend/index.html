<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lok Setu – Let's fix the city together</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f9;--card:#fff;--tx:#14213d;--mu:#667085;--pr:#0b3fae;--pr2:#2563eb;--ac:#e0a21b;--ok:#15803d;--wa:#d97706;--bd:#e3e8f2;--sh:0 8px 30px rgba(20,33,61,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c30;--tx:#e8edf8;--mu:#93a0ba;--bd:#24304a;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c30;--tx:#e8edf8;--mu:#93a0ba;--bd:#24304a;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
h1,h2,h3,.logo{font-family:Georgia,serif}p,button,input,select,textarea,.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;cursor:pointer}.logo i{font-style:normal;background:var(--pr);color:#fff;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}nav a{padding:8px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font:600 14px system-ui;cursor:pointer}nav a.on{color:var(--pr2);box-shadow:inset 0 -2px var(--pr2)}
.btn{border:0;border-radius:999px;padding:11px 20px;font:600 14px system-ui;cursor:pointer;transition:.2s;background:var(--pr2);color:#fff}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn.o{background:transparent;border:1.5px solid var(--pr2);color:var(--pr2)}.btn.g{background:var(--ac)}.btn.sm{padding:6px 12px;font-size:12px}.btn.r{background:#dc2626}
main{max-width:1050px;margin:auto;padding:20px 16px 90px;animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px;grid-template-columns:1fr 1.5fr}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#0b3fae,#2563eb,#0ea5e9);background-size:200% 200%;animation:g 8s ease infinite;color:#fff;border:0}
@keyframes g{50%{background-position:100% 50%}}
.hero h2{font-size:28px;margin:6px 0 16px}.hero .btn{background:#fff;color:var(--pr);width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{text-align:center;padding:14px 6px;border-radius:14px;background:var(--bg)}.stat b{font-size:30px;display:block}.stat span{font:12px system-ui;color:var(--mu)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--bd);font:600 13px system-ui;cursor:pointer;background:var(--card);color:var(--tx);transition:.2s}.chip:hover{background:var(--pr2);color:#fff;border-color:var(--pr2)}
.opt{display:flex;align-items:center;gap:10px;padding:14px;border:1.5px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;transition:.2s;font:500 15px system-ui}.opt:hover,.opt.on{border-color:var(--pr2);transform:translateX(4px);background:color-mix(in srgb,var(--pr2) 8%,var(--card))}
.opt .rd{width:18px;height:18px;border:2px solid var(--mu);border-radius:50%;flex:none}.opt.on .rd{background:var(--pr2);border-color:var(--pr2);box-shadow:inset 0 0 0 3px var(--card)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin:6px 0 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--pr2)}
label{font:600 13px system-ui;color:var(--mu)}
.rep{display:flex;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:16px;margin:10px 0;background:var(--card);animation:in .4s;font-family:system-ui}.rep img{width:74px;height:74px;object-fit:cover;border-radius:12px}
.rep h4{margin:0 0 4px;font-size:16px}.rep p{margin:2px 0;color:var(--mu);font-size:13px}.rep .top{flex:1;min-width:0}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font:700 11px system-ui;color:#fff}.s-Pending{background:var(--wa)}.s-Progress{background:var(--pr2)}.s-Resolved{background:var(--ok)}.s-Rejected{background:#6b7280}
.up{border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:6px 10px;cursor:pointer;font:700 13px system-ui;color:var(--tx);align-self:flex-start}.up:hover{background:var(--pr2);color:#fff}
.tl{border-left:3px solid var(--bd);margin:12px 0 0 8px;padding-left:16px;font:14px system-ui}.tl div{position:relative;margin-bottom:14px}.tl div:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pr2)}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),#22c55e);transition:width 1s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#111827;color:#fff;padding:12px 20px;border-radius:14px;font:600 14px system-ui;transition:.4s;z-index:50;max-width:90vw}.toast.on{transform:translate(-50%,0)}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);border:0;font-size:26px;box-shadow:0 8px 24px rgba(224,162,27,.5);cursor:pointer;animation:pl 2.5s infinite;z-index:30}
@keyframes pl{50%{transform:scale(1.08)}}
.mu{color:var(--mu);font:13px system-ui}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chat{position:fixed;right:18px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 36px));z-index:40;display:none}.chat.on{display:block;animation:in .3s}
/* ===== v2 design + animation layer ===== */
body{background-image:radial-gradient(circle at 15% 10%,rgba(37,99,235,.10),transparent 40%),radial-gradient(circle at 90% 80%,rgba(224,162,27,.12),transparent 40%)}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#3b82f6;top:-80px;left:-80px}.b2{width:300px;height:300px;background:#f59e0b;bottom:-60px;right:-60px;animation-delay:-5s}.b3{width:240px;height:240px;background:#22c55e;top:45%;left:55%;opacity:.25;animation-delay:-9s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.2)}}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--pr2),var(--ac));z-index:99}
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0b3fae,#2563eb);display:grid;place-items:center;color:#fff;transition:opacity .7s,visibility .7s}
#splash.hide{opacity:0;visibility:hidden}#splash div{text-align:center;font:700 34px Georgia,serif;animation:pop .9s cubic-bezier(.2,1.5,.4,1)}
#splash i{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 14px;background:#fff;color:var(--pr);border-radius:24px;font-style:normal;font-size:46px;animation:spin 1.2s ease}
#splash small{display:block;font:14px system-ui;opacity:.8;margin-top:6px;letter-spacing:3px}
@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes spin{from{transform:rotate(-180deg) scale(.3)}}
.logo i{background:linear-gradient(135deg,var(--pr),var(--pr2));transition:.4s}.logo:hover i{transform:rotate(360deg) scale(1.1)}
.card{transition:transform .3s,box-shadow .3s;backdrop-filter:blur(6px)}.card:hover{box-shadow:0 16px 40px rgba(37,99,235,.18)}
main>*,.grid>div>*{animation:up .6s both}.grid>div>*:nth-child(2){animation-delay:.12s}.grid>div:nth-child(2){animation-delay:.2s}
.rep:nth-child(2){animation-delay:.08s}.rep:nth-child(3){animation-delay:.16s}.rep:nth-child(4){animation-delay:.24s}.rep:nth-child(n+5){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.98)}}
.rep{transition:.25s}.rep:hover{transform:translateY(-4px) scale(1.01);border-color:var(--pr2);box-shadow:var(--sh)}
.btn{position:relative;overflow:hidden}.btn:before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transition:.6s}.btn:hover:before{left:130%}
.btn:active{transform:scale(.95)}
.hero{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .15s}
.hero:after{content:"";position:absolute;width:220px;height:220px;right:-60px;top:-70px;border-radius:50%;background:rgba(255,255,255,.14);animation:fl 6s ease-in-out infinite alternate}
.hero h2{background:linear-gradient(90deg,#fff,#bfdbfe,#fde68a,#fff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.tag.s-Pending{animation:ring 2s infinite}@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,119,6,.6)}100%{box-shadow:0 0 0 10px transparent}}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}.stat{transition:.3s}.stat:hover{transform:translateY(-4px);background:color-mix(in srgb,var(--pr2) 10%,var(--bg))}
.fab:before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);animation:rp 2s infinite}@keyframes rp{to{transform:scale(1.7);opacity:0}}
.opt.on{animation:bo .4s}@keyframes bo{50%{transform:translateX(10px)}}
.bar i{background-size:200%;animation:sh 3s linear infinite}
.tl div{animation:up .5s both}.tl div:last-child:before{animation:ring 1.6s infinite}
#cf{position:fixed;inset:0;pointer-events:none;z-index:150}
.steps{display:flex;gap:6px;margin:10px 0}.steps i{flex:1;height:5px;border-radius:9px;background:var(--bd)}.steps i.on{background:linear-gradient(90deg,var(--pr2),var(--ac))}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<header><div class="logo" onclick="go('')"><i>L</i>LOK SETU</div><nav id="nav"></nav></header>
<main id="app"></main>
<button class="fab" title="Setu Assistant" onclick="chat.classList.toggle('on')">💬</button>
<div class="card chat" id="chat"><b>Setu Assistant</b><p class="mu" id="cm">Describe your problem and I'll pick the right category for you.</p><input id="ci" placeholder="e.g. no water since morning"><button class="btn sm" onclick="ask()">Suggest</button></div>
<div class="toast" id="toast"></div>
<script>
const CATS={Street_Light:['💡','Street Light','light lamp dark pole'],Road_Damage:['🚧','Road Damage','road pothole crack bridge footpath'],Water_Supply:['💧','Water Supply','water tap pipe leak supply'],Sewage:['🚰','Sewage','sewage drain gutter overflow smell'],Electricity:['⚡','Electricity','power electric wire transformer outage'],Garbage:['🗑️','Garbage','garbage waste trash dump litter'],Other:['❓','Other','']};
const ADMIN_PASS='admin123',K='loksetu_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{reports:[],name:'',admin:false,points:0,seeded:false};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage full – try a smaller photo')}}
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!S.seeded){const d=Date.now();S.reports=[['Broken street light near market','Street_Light','Sector 4 Main Market','Pending',12],['Large pothole on ring road','Road_Damage','Ring Road, Gate 2','Progress',31],['Water leakage from main pipe','Water_Supply','Lake View Colony','Resolved',18]].map((r,i)=>({id:'LS'+(1001+i),title:r[0],cat:r[1],desc:'Citizen reported issue, needs attention.',loc:r[2],status:r[3],votes:r[4],voters:[],mine:false,img:'',by:'Citizen',t:d-864e5*(i+1),log:[{s:'Pending',t:d-864e5*(i+1)}]}));S.seeded=true;save()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
function go(h){location.hash='#/'+h}
const chat=$('#chat');
function ask(){const q=$('#ci').value.toLowerCase();let best='Other',n=0;for(const k in CATS){const c=CATS[k][2].split(' ').filter(w=>w&&q.includes(w)).length;if(c>n){n=c;best=k}}$('#cm').innerHTML=n?`This looks like <b>${CATS[best][0]} ${CATS[best][1]}</b>. <a href="#/report/${best}" onclick="chat.classList.remove('on')">Report it now →</a>`:'Not sure – choose "Other" or add more detail.'}
function stats(l){return{t:l.length,p:l.filter(r=>r.status=='Pending').length,r:l.filter(r=>r.status=='Resolved').length}}
function badge(){const p=S.points;return p>=100?'🏆 City Hero':p>=50?'🥇 Guardian':p>=20?'🥈 Active Citizen':'🌱 Newcomer'}
function nav(p){const it=[['','Dashboard'],['public','Public Reports'],['track','Track'],['admin','Admin']];$('#nav').innerHTML=it.map(i=>`<a class="${p==i[0]?'on':''}" href="#/${i[0]}">${i[1]}</a>`).join('')+`<a onclick="theme()" title="Theme">🌓</a>`}
function theme(){const r=document.documentElement;const d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function card(r,adm){const c=CATS[r.cat]||CATS.Other;return `<div class="rep">${r.img?`<img src="${r.img}" alt="">`:`<div style="font-size:38px;width:74px;text-align:center">${c[0]}</div>`}<div class="top"><h4>${esc(r.title)}</h4><p>${c[1]} · 📍 ${esc(r.loc)}</p><p>${new Date(r.t).toLocaleDateString()} · <b>${r.id}</b></p><span class="tag s-${r.status}">${r.status}</span>${adm?`<div class="row" style="margin-top:8px"><select style="width:auto;margin:0;padding:6px" onchange="setSt('${r.id}',this.value)">${['Pending','Progress','Resolved','Rejected'].map(s=>`<option ${s==r.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn r sm" onclick="del('${r.id}')">Delete</button></div>`:''}</div>${adm?'':`<button class="up" onclick="vote('${r.id}')">▲ ${r.votes}</button>`}</div>`}
function vote(id){const r=S.reports.find(x=>x.id==id);if(r.voters.includes('me'))return toast('Already supported');r.voters.push('me');r.votes++;save();toast('Thanks for supporting!');route(1)}
function setSt(id,s){const r=S.reports.find(x=>x.id==id);r.status=s;r.log.push({s,t:Date.now()});save();toast('Status updated');route(1)}
function del(id){if(confirm('Delete this report?')){S.reports=S.reports.filter(r=>r.id!=id);save();route(1)}}
function dash(){const m=S.reports.filter(r=>r.mine),a=stats(S.reports),u=stats(m);
return `<div class="grid"><div><div class="card hero"><span class="sans">● LOK SETU</span><h2>Let's fix the city together</h2><button class="btn" onclick="go('report')">Report an Issue</button></div>
<div class="card" style="margin-top:18px"><b>Quick Report Categories</b><div class="cats">${Object.keys(CATS).map(k=>`<span class="chip" onclick="go('report/${k}')">${CATS[k][0]} ${CATS[k][1]}</span>`).join('')}</div><b>Reports Received</b><div class="stats"><div class="stat"><b data-n="${a.t}">0</b><span>Total</span></div><div class="stat"><b style="color:var(--wa)" data-n="${a.p}">0</b><span>Pending</span></div><div class="stat"><b style="color:var(--ok)" data-n="${a.r}">0</b><span>Resolved</span></div></div>
<p class="mu">City resolution rate</p><div class="bar"><i style="width:${a.t?a.r/a.t*100:0}%"></i></div></div></div>
<div class="card"><p class="mu">Hello,</p><h2 style="margin:0 0 14px">${esc(S.name||'Guest User')}</h2>
<div class="opt" onclick="go('report')"><span style="font-size:26px">📝</span><div><b>Report Issue</b><div class="mu">Submit a new complaint or civic issue.</div></div></div>
<b>Your Impact</b> <span class="tag" style="background:var(--ac)">${badge()} · ${S.points} pts</span><div class="stats"><div class="stat"><b data-n="${u.t}">0</b><span>Reported</span></div><div class="stat"><b style="color:var(--ok)" data-n="${u.r}">0</b><span>Resolved</span></div><div class="stat"><b style="color:var(--wa)" data-n="${u.p}">0</b><span>Pending</span></div></div>
<h3>Your Recent Issues</h3>${m.length?m.slice(-3).reverse().map(r=>card(r)).join(''):'<p class="mu">Nothing yet – be the first! You earn 10 points per report.</p>'}
${S.name?'':`<label>Your name</label><input id="nm" placeholder="Enter name"><button class="btn sm" onclick="S.name=$('#nm').value.trim();save();route()">Save name</button>`}</div></div>`}
let sel='',img='',loc='';
function rep(k){if(CATS[k])sel=k;return `<div class="card" style="max-width:640px;margin:auto"><a class="mu" style="cursor:pointer" onclick="history.back()">← Back</a><h2 style="text-align:center">Select Category</h2>
${Object.keys(CATS).map(c=>`<div class="opt ${sel==c?'on':''}" onclick="sel='${c}';route(1)"><span class="rd"></span>${CATS[c][0]} ${CATS[c][1]}</div>`).join('')}
${sel?`<label>Title</label><input id="ti" placeholder="Short summary"><label>Description</label><textarea id="de" rows="3" placeholder="What is wrong?"></textarea><label>Location / landmark</label><div class="row"><input id="lo" value="${esc(loc)}" style="flex:1" placeholder="Area, street"><button class="btn sm o" onclick="gps()">📍 Use GPS</button></div>
<label>Photo (optional)</label><input type="file" id="ph" accept="image/*" onchange="photo(this)"><div id="pv">${img?`<img src="${img}" style="width:100%;border-radius:12px">`:''}</div>
<button class="btn g" style="width:100%" onclick="submit()">Submit Report</button>`:''}</div>`}
function gps(){if(!navigator.geolocation)return toast('GPS not supported');navigator.geolocation.getCurrentPosition(p=>{loc=`GPS ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`;$('#lo').value=loc;toast('Location added')},()=>toast('Location permission denied'))}
function photo(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,600/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);$('#pv').innerHTML=`<img src="${img}" style="width:100%;border-radius:12px">`};i.src=e.target.result};rd.readAsDataURL(f)}
function submit(){const t=$('#ti').value.trim(),l=$('#lo').value.trim();if(!t||!l)return toast('Title and location are required');const id='LS'+(2000+S.reports.length+Math.floor(Math.random()*900));S.reports.push({id,title:t,cat:sel,desc:$('#de').value,loc:l,status:'Pending',votes:1,voters:['me'],mine:true,img,by:S.name||'Guest',t:Date.now(),log:[{s:'Pending',t:Date.now()}]});S.points+=10;save();sel='';img='';loc='';toast('Submitted! Tracking ID: '+id);go('track/'+id)}
function pub(){return `<h2>Public Reports</h2><div class="row"><input id="q" placeholder="Search reports…" style="flex:1" oninput="pl()"><select id="fc" style="width:auto" onchange="pl()"><option value="">All</option>${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k][1]}</option>`).join('')}</select><select id="fs" style="width:auto" onchange="pl()"><option value="">Any status</option><option>Pending</option><option>Progress</option><option>Resolved</option></select></div><div id="pl"></div>`}
function pl(){const q=$('#q').value.toLowerCase(),c=$('#fc').value,s=$('#fs').value;const l=S.reports.filter(r=>(!c||r.cat==c)&&(!s||r.status==s)&&(r.title+r.loc).toLowerCase().includes(q)).sort((a,b)=>b.votes-a.votes);$('#pl').innerHTML=l.map(r=>card(r)).join('')||'<p class="mu">No reports found.</p>'}
function track(id){const r=S.reports.find(x=>x.id==(id||'').toUpperCase());return `<div class="card" style="max-width:600px;margin:auto"><h2>Track your report</h2><div class="row"><input id="tid" value="${esc(id||'')}" placeholder="e.g. LS1001" style="flex:1"><button class="btn" onclick="go('track/'+$('#tid').value.trim())">Track</button></div>${id?(r?card(r)+`<div class="tl">${r.log.map(l=>`<div><b>${l.s}</b><br><span class="mu">${new Date(l.t).toLocaleString()}</span></div>`).join('')}</div>`:'<p class="mu">No report found with that ID.</p>'):''}</div>`}
function admin(){if(!S.admin)return `<div class="card" style="max-width:380px;margin:auto"><h2>Admin Login</h2><label>Password</label><input id="ap" type="password" placeholder="Demo password: admin123"><button class="btn" style="width:100%" onclick="login()">Login</button></div>`;
const a=stats(S.reports),mx=Math.max(1,...Object.keys(CATS).map(k=>S.reports.filter(r=>r.cat==k).length));
return `<div class="row"><h2 style="margin:0;flex:1">Admin Dashboard</h2><button class="btn o sm" onclick="exp()">Copy CSV</button><button class="btn o sm" onclick="S.admin=false;save();route()">Logout</button></div>
<div class="stats"><div class="stat card"><b>${a.t}</b><span>Total</span></div><div class="stat card"><b style="color:var(--wa)">${a.p}</b><span>Pending</span></div><div class="stat card"><b style="color:var(--ok)">${a.r}</b><span>Resolved</span></div></div>
<div class="card" style="margin:18px 0"><b>Reports by category</b>${Object.keys(CATS).map(k=>{const n=S.reports.filter(r=>r.cat==k).length;return `<div class="sans" style="margin:8px 0;font-size:13px">${CATS[k][0]} ${CATS[k][1]} (${n})<div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join('')}</div>
<b>Manage reports</b>${S.reports.slice().sort((a,b)=>b.t-a.t).map(r=>card(r,1)).join('')}`}
function exp(){const rows=[['ID','Title','Category','Location','Status','Votes','Date'],...S.reports.map(r=>[r.id,r.title,r.cat,r.loc,r.status,r.votes,new Date(r.t).toISOString()])].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');navigator.clipboard.writeText(rows).then(()=>toast('CSV copied to clipboard'),()=>toast('Copy blocked by browser'))}
function count(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n;let i=0;if(!n)return;const t=setInterval(()=>{e.textContent=++i;if(i>=n)clearInterval(t)},40)})}
function route(keep){const [p,a]=(location.hash.replace('#/','')||'').split('/'),app=$('#app');nav(p);
app.innerHTML=p=='report'?rep(a):p=='public'?pub():p=='track'?track(a):p=='admin'?admin():dash();
if(p=='public')pl();count();if(!keep)scrollTo(0,0);app.style.animation=keep?'none':'in .5s'}
addEventListener('hashchange',()=>route());route();
/* ===== v2: effects + optional API sync ===== */
document.body.insertAdjacentHTML('afterbegin','<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="prog"></div><canvas id="cf"></canvas><div id="splash"><div><i>L</i>LOK SETU<small>LET\'S FIX THE CITY</small></div></div>');
setTimeout(()=>$('#splash').classList.add('hide'),1300);
addEventListener('scroll',()=>{$('#prog').style.width=(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100)+'%'});
function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-3,r:Math.random()*6+3,c:`hsl(${Math.random()*360},85%,60%)`,a:1}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a-=.008;x.globalAlpha=Math.max(0,p.a);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<130)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener('mousemove',e=>{const h=e.target.closest&&e.target.closest('.hero');if(h){const r=h.getBoundingClientRect();h.style.transform=`perspective(700px) rotateY(${((e.clientX-r.left)/r.width-.5)*8}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*8}deg)`}else document.querySelectorAll('.hero').forEach(h=>h.style.transform='')});
/* API sync: works when served by the Node backend, silently falls back to browser storage otherwise */
let online=false;
async function api(m,u,b){const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json','x-admin-token':S.token||''},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
function login(){const p=$('#ap').value;if(online)api('POST','/login',{password:p}).then(r=>{S.token=r.token;S.admin=true;save();route()}).catch(()=>toast('Wrong password'));else if(p==ADMIN_PASS){S.admin=true;save();route()}else toast('Wrong password')}
const _sub=submit,_set=setSt,_del=del,_vote=vote;
submit=function(){const n=S.reports.length;_sub();if(S.reports.length>n){const r=S.reports[S.reports.length-1];confetti();(S.mine=S.mine||[]).push(r.id);save();if(online)api('POST','/reports',r).catch(()=>toast('Server save failed'))}};
setSt=function(id,s){_set(id,s);if(online)api('PATCH','/reports/'+id,{status:s}).catch(()=>toast('Server update failed'))};
del=function(id){const n=S.reports.length;_del(id);if(online&&S.reports.length<n)api('DELETE','/reports/'+id).catch(()=>{})};
vote=function(id){_vote(id);if(online)api('POST','/reports/'+id+'/vote').catch(()=>{})};
api('GET','/reports').then(l=>{online=true;S.reports=l.map(r=>({...r,voters:[],mine:(S.mine||[]).includes(r.id)}));route(1);toast('🟢 Connected to live server')}).catch(()=>{});

</script></body></html>
