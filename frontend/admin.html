<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — LOK SETU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <div class="container row">
    <a href="index.html" class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-word">LOK SETU</span>
    </a>
    <span style="color:var(--ink-soft); font-size:14px;">Admin console</span>
  </div>
</header>

<div class="app-shell" style="grid-template-columns: 1fr; max-width: 760px;">
  <main>
    <div class="panel" id="key-panel">
      <div class="panel-head"><h2>Admin access</h2><span></span></div>
      <p style="color:var(--ink-soft); font-size:14px; margin-top:-8px;">
        Enter the admin key set as <code>ADMIN_KEY</code> in the backend's <code>.env</code> file.
      </p>
      <div class="form-group">
        <label for="admin-key">Admin key</label>
        <input type="password" id="admin-key" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" id="unlock-btn">Unlock</button>
      <div id="key-alert"></div>
    </div>

    <div class="panel" id="reports-panel" style="display:none;">
      <div class="panel-head">
        <h2>All Reports</h2>
        <button class="btn btn-outline" id="refresh-btn">Refresh</button>
      </div>
      <div class="filter-row" id="filter-row">
        <button class="chip-toggle active" data-status="">All</button>
        <button class="chip-toggle" data-status="pending">Pending</button>
        <button class="chip-toggle" data-status="in_progress">In progress</button>
        <button class="chip-toggle" data-status="resolved">Resolved</button>
      </div>
      <div id="admin-list"></div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/helpers.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
