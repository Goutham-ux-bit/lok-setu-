<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — LOK SETU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <div class="container row">
    <a href="index.html" class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-word">LOK SETU</span>
    </a>
  </div>
</header>

<main class="auth-shell">
  <h1 id="form-title">Welcome back</h1>
  <p class="sub" id="form-sub">Log in to track the issues you've reported</p>

  <div id="alert-box"></div>

  <div class="form-group" id="name-group" style="display:none">
    <label for="name">Full name</label>
    <input type="text" id="name" placeholder="e.g. Asha Rao">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>

  <div class="divider">or</div>
  <a href="user.html" class="btn btn-outline btn-block">Continue as Guest</a>

  <p class="auth-switch" id="switch-line">
    New to LOK SETU? <a href="#" id="switch-link">Create an account</a>
  </p>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
